<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>担当者やり取りメモ</title>
    
    <!-- PWA（スマホアプリ化）のためのアイコン設定 -->
    <meta name="theme-color" content="#5d4037">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="やり取りメモ">
    
    <link rel="apple-touch-icon" href="icon.png">
    <link rel="icon" type="image/png" href="icon.png">
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    
    <style>
        body {
            font-family: "Helvetica Neue", Arial, "Hiragino Kaku Gothic ProN", "Hiragino Sans", Meiryo, sans-serif;
            background-color: #f5f5f4; 
            color: #1c1917; /* Stone-900: より濃い色にして視認性アップ */
            -webkit-tap-highlight-color: transparent;
            font-size: 16px;
        }
        .page {
            display: none;
            animation: fadeIn 0.3s ease-out;
        }
        .page.active {
            display: block;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .attachment-preview {
            max-width: 100%;
            max-height: 250px;
            border-radius: 0.5rem;
            object-fit: contain;
            background-color: #e7e5e4;
            margin-top: 0.5rem;
        }
        input[type="file"] {
            display: none;
        }
        .file-upload-btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            padding: 0.6rem 1.2rem;
            background-color: #fafaf9;
            color: #44403c;
            border-radius: 0.5rem;
            border: 1px solid #d6d3d1;
            cursor: pointer;
            font-size: 1rem;
            font-weight: bold;
            transition: all 0.2s;
        }
        /* 改良版ズームコンテナ */
        #zoomOverlay {
            position: fixed;
            inset: 0;
            background-color: rgba(0,0,0,0.95);
            z-index: 200;
            display: none;
            flex-direction: column;
            touch-action: none;
        }
        #zoomContainer {
            flex: 1;
            width: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            position: relative;
        }
        #fullSizeImage {
            max-width: 100%;
            max-height: 100%;
            will-change: transform;
            user-select: none;
            -webkit-user-drag: none;
            transition: transform 0.05s linear;
        }
        /* 入力欄の文字を太くハッキリさせる */
        input, textarea {
            font-weight: bold !important;
            color: #0c0a09 !important; /* Stone-950 */
        }
        /* 茶系カスタムカラー */
        .bg-app-primary { background-color: #5d4037; } 
        .bg-app-accent { background-color: #8d6e63; } 
    </style>
</head>
<body class="min-h-screen pb-20">

    <header class="bg-app-primary text-stone-50 p-4 sticky top-0 z-50 shadow-md flex items-center justify-between">
        <div class="flex items-center gap-3">
            <button id="backBtn" class="hidden p-2 -ml-2 rounded-full hover:bg-stone-700/50" onclick="app.showList()">
                <i data-lucide="chevron-left"></i>
            </button>
            <h1 id="headerTitle" class="text-xl font-bold">担当者一覧</h1>
        </div>
        <button id="addPersonBtn" class="p-2 -mr-2 rounded-full hover:bg-stone-700/50" onclick="app.openPersonModal()">
            <i data-lucide="user-plus"></i>
        </button>
    </header>

    <main class="p-4 max-w-lg mx-auto">
        
        <!-- === ページ1: 担当者リスト画面 === -->
        <div id="listPage" class="page active space-y-4">
            <div class="relative">
                <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
                    <i data-lucide="search" class="text-stone-500 w-5 h-5"></i>
                </div>
                <input type="text" id="searchInput" class="w-full border-2 border-stone-300 rounded-xl pl-10 pr-3 py-4 text-lg font-bold focus:border-amber-800 outline-none shadow-sm bg-white" placeholder="名前・会社名で検索" oninput="app.renderPersonList()">
            </div>

            <div id="personList" class="flex flex-col gap-3"></div>
            <div class="text-center text-stone-500 py-10 hidden font-bold" id="emptyListMessage">担当者が見つかりません。</div>

            <div class="mt-12 pt-8 border-t border-stone-300">
                <h3 class="text-sm font-bold text-stone-500 uppercase tracking-widest mb-4 flex items-center gap-2">
                    <i data-lucide="database" class="w-4 h-4"></i> データ管理
                </h3>
                <div class="grid grid-cols-2 gap-3">
                    <button class="bg-white border-2 border-stone-300 text-stone-700 p-4 rounded-xl text-base font-bold flex flex-col items-center gap-2 shadow-sm active:bg-stone-100" onclick="app.exportDataJSON()">
                        <i data-lucide="download" class="w-6 h-6 text-stone-600"></i> 一括保存(JSON)
                    </button>
                    <label class="bg-white border-2 border-stone-300 text-stone-700 p-4 rounded-xl text-base font-bold flex flex-col items-center gap-2 shadow-sm active:bg-stone-100 cursor-pointer text-center">
                        <i data-lucide="upload" class="w-6 h-6 text-stone-600"></i> データ復元
                        <input type="file" accept=".json" onchange="app.importDataJSON(event)">
                    </label>
                    <button class="bg-white border-2 border-stone-300 text-stone-700 p-4 rounded-xl text-base font-bold flex flex-col items-center gap-2 shadow-sm active:bg-stone-100 col-span-2" onclick="app.exportLogsCSV()">
                        <i data-lucide="file-spreadsheet" class="w-6 h-6 text-stone-600"></i> 記録をExcel用に出力(CSV)
                    </button>
                </div>
            </div>
        </div>

        <!-- === ページ2: やり取り詳細画面 === -->
        <div id="detailPage" class="page">
            <div class="bg-white p-5 rounded-xl shadow-sm border border-stone-200 mb-4">
                <div class="flex justify-between items-start mb-2">
                    <h2 id="detailName" class="text-2xl font-bold text-stone-900 leading-tight"></h2>
                    <div class="flex gap-2">
                        <button class="text-stone-500 bg-stone-100 p-2 rounded-lg" onclick="app.editCurrentPerson()">
                            <i data-lucide="edit-2" class="w-5 h-5"></i>
                        </button>
                        <button class="text-red-500 bg-red-50 p-2 rounded-lg" onclick="app.deleteCurrentPerson()">
                            <i data-lucide="trash-2" class="w-5 h-5"></i>
                        </button>
                    </div>
                </div>
                <p id="detailCompany" class="text-base text-stone-600 font-bold mb-4"></p>
                <div class="bg-stone-50 p-4 rounded-lg border border-stone-200">
                    <p class="text-xs text-stone-500 font-bold mb-1 uppercase">基本メモ</p>
                    <p id="detailMemo" class="text-lg text-stone-900 font-bold whitespace-pre-wrap leading-relaxed"></p>
                </div>
            </div>

            <!-- 新規記録入力 -->
            <div class="bg-stone-200 p-4 rounded-xl border border-stone-300 mb-6">
                <textarea id="logText" class="w-full border-2 border-stone-300 rounded-lg p-4 text-lg font-bold focus:border-amber-800 outline-none mb-3 min-h-[120px]" placeholder="内容を入力..."></textarea>
                <div class="flex items-center justify-between">
                    <div>
                        <label for="logFile" class="file-upload-btn shadow-sm">
                            <i data-lucide="paperclip" class="w-5 h-5 mr-2"></i> 写真
                        </label>
                        <input type="file" id="logFile" accept="image/*" onchange="app.handleFileSelect(event)">
                        <div id="selectedFileName" class="text-xs text-stone-500 mt-1 font-bold truncate max-w-[120px]"></div>
                    </div>
                    <button class="bg-app-accent text-white px-8 py-3 rounded-lg font-bold text-lg shadow-sm active:scale-95 transition" onclick="app.addLog()">記録する</button>
                </div>
            </div>

            <!-- タイムライン -->
            <div class="relative pl-5 border-l-4 border-stone-300 ml-4 space-y-8" id="timelineList"></div>
        </div>
    </main>

    <!-- モーダル: 担当者追加/編集 -->
    <div id="personModal" class="fixed inset-0 bg-stone-900/60 z-[100] hidden flex items-center justify-center p-4 backdrop-blur-sm">
        <div class="bg-white rounded-2xl w-full max-w-sm overflow-hidden shadow-2xl">
            <div class="p-4 border-b border-stone-100 flex justify-between items-center bg-stone-50">
                <h3 class="font-bold text-stone-900 text-lg" id="modalTitle">担当者の追加</h3>
                <button class="text-stone-400 p-1" onclick="app.closeModal('personModal')"><i data-lucide="x"></i></button>
            </div>
            <div class="p-5 space-y-4">
                <input type="hidden" id="personId">
                <div>
                    <label class="block text-sm font-bold text-stone-500 mb-1">お名前 *</label>
                    <input type="text" id="personName" class="w-full border-2 border-stone-300 rounded-lg p-4 text-lg font-bold outline-none focus:border-amber-800" placeholder="例: 山田 太郎">
                </div>
                <div>
                    <label class="block text-sm font-bold text-stone-500 mb-1">会社名</label>
                    <input type="text" id="personCompany" class="w-full border-2 border-stone-300 rounded-lg p-4 text-lg font-bold outline-none focus:border-amber-800" placeholder="例: 株式会社ABC">
                </div>
                <div>
                    <label class="block text-sm font-bold text-stone-500 mb-1">基本メモ</label>
                    <textarea id="personMemo" class="w-full border-2 border-stone-300 rounded-lg p-4 text-lg font-bold outline-none focus:border-amber-800 h-32" placeholder="特徴など"></textarea>
                </div>
                <button class="w-full bg-app-primary text-white py-4 rounded-xl font-bold text-lg shadow-md active:scale-95 transition" onclick="app.savePerson()">保存する</button>
            </div>
        </div>
    </div>

    <!-- モーダル: 記録の編集 -->
    <div id="editLogModal" class="fixed inset-0 bg-stone-900/60 z-[100] hidden flex items-center justify-center p-4 backdrop-blur-sm">
        <div class="bg-white rounded-2xl w-full max-w-sm overflow-hidden shadow-2xl">
            <div class="p-4 border-b border-stone-100 flex justify-between items-center bg-stone-50">
                <h3 class="font-bold text-stone-900 text-lg">記録を修正</h3>
                <button class="text-stone-400 p-1" onclick="app.closeModal('editLogModal')"><i data-lucide="x"></i></button>
            </div>
            <div class="p-5 space-y-4">
                <input type="hidden" id="editLogId">
                <div>
                    <label class="block text-sm font-bold text-stone-500 mb-1">内容</label>
                    <textarea id="editLogText" class="w-full border-2 border-stone-300 rounded-lg p-4 text-lg font-bold outline-none focus:border-amber-800 h-48" placeholder="内容を入力..."></textarea>
                </div>
                <button class="w-full bg-app-accent text-white py-4 rounded-xl font-bold text-lg shadow-md active:scale-95 transition" onclick="app.saveEditedLog()">上書き保存</button>
            </div>
        </div>
    </div>

    <!-- モーダル: 画像拡大（パン＆ズーム対応） -->
    <div id="zoomOverlay">
        <div class="flex justify-end p-4">
            <button class="text-white bg-white/20 p-3 rounded-full active:bg-white/40" onclick="app.closeModal('zoomOverlay')">
                <i data-lucide="x" class="w-6 h-6"></i>
            </button>
        </div>
        <div id="zoomContainer">
            <img id="fullSizeImage" src="">
        </div>
    </div>

    <!-- 共通ダイアログ -->
    <div id="alertModal" class="fixed inset-0 bg-stone-900/60 z-[300] hidden flex items-center justify-center p-4">
        <div class="bg-white rounded-xl max-w-xs w-full p-6 text-center shadow-2xl">
            <p id="alertMessage" class="text-stone-900 font-bold text-xl mb-6"></p>
            <button class="w-full bg-app-primary text-white py-3 rounded-lg font-bold text-lg" onclick="UI.closeAlert()">OK</button>
        </div>
    </div>

    <div id="confirmModal" class="fixed inset-0 bg-stone-900/60 z-[300] hidden flex items-center justify-center p-4">
        <div class="bg-white rounded-xl max-w-xs w-full p-6 text-center shadow-2xl">
            <p id="confirmMessage" class="text-stone-900 font-bold text-xl mb-6"></p>
            <div class="flex gap-3">
                <button class="flex-1 bg-stone-200 text-stone-700 py-3 rounded-lg font-bold text-lg" onclick="UI.closeConfirm(false)">戻る</button>
                <button class="flex-1 bg-red-600 text-white py-3 rounded-lg font-bold text-lg" onclick="UI.closeConfirm(true)">削除</button>
            </div>
        </div>
    </div>

    <script>
        const UI = {
            confirmCallback: null,
            showAlert(msg) {
                document.getElementById('alertMessage').textContent = msg;
                document.getElementById('alertModal').classList.remove('hidden');
            },
            closeAlert() { document.getElementById('alertModal').classList.add('hidden'); },
            showConfirm(msg, callback) {
                document.getElementById('confirmMessage').textContent = msg;
                document.getElementById('confirmModal').classList.remove('hidden');
                this.confirmCallback = callback;
            },
            closeConfirm(result) {
                document.getElementById('confirmModal').classList.add('hidden');
                if (result && this.confirmCallback) this.confirmCallback();
                this.confirmCallback = null;
            }
        };

        class DBManager {
            constructor() {
                this.dbName = 'DeaiAppDB_V2';
                this.dbVersion = 1;
                this.db = null;
            }
            async init() {
                return new Promise((resolve, reject) => {
                    const request = indexedDB.open(this.dbName, this.dbVersion);
                    request.onupgradeneeded = (e) => {
                        const db = e.target.result;
                        db.createObjectStore('persons', { keyPath: 'id' }).createIndex('updatedAt', 'updatedAt');
                        db.createObjectStore('logs', { keyPath: 'id' }).createIndex('personId', 'personId');
                    };
                    request.onsuccess = (e) => { this.db = e.target.result; resolve(); };
                    request.onerror = (e) => reject(e.target.errorCode);
                });
            }
            async savePerson(person) {
                person.updatedAt = Date.now();
                const tx = this.db.transaction(['persons'], 'readwrite');
                tx.objectStore('persons').put(person);
                return new Promise(resolve => tx.oncomplete = () => resolve(person));
            }
            async getAllPersons() {
                const tx = this.db.transaction(['persons'], 'readonly');
                const req = tx.objectStore('persons').index('updatedAt').getAll();
                return new Promise(resolve => req.onsuccess = () => resolve(req.result.reverse()));
            }
            async getPerson(id) {
                const tx = this.db.transaction(['persons'], 'readonly');
                const req = tx.objectStore('persons').get(id);
                return new Promise(resolve => req.onsuccess = () => resolve(req.result));
            }
            async deletePerson(id) {
                const logs = await this.getLogsByPersonId(id);
                const tx = this.db.transaction(['persons', 'logs'], 'readwrite');
                tx.objectStore('persons').delete(id);
                logs.forEach(l => tx.objectStore('logs').delete(l.id));
                return new Promise(resolve => tx.oncomplete = () => resolve());
            }
            async saveLog(log) {
                if (!log.createdAt) log.createdAt = Date.now();
                const tx = this.db.transaction(['logs'], 'readwrite');
                tx.objectStore('logs').put(log);
                return new Promise(resolve => tx.oncomplete = () => resolve(log));
            }
            async getLog(logId) {
                const tx = this.db.transaction(['logs'], 'readonly');
                const req = tx.objectStore('logs').get(logId);
                return new Promise(resolve => req.onsuccess = () => resolve(req.result));
            }
            async getLogsByPersonId(personId) {
                const tx = this.db.transaction(['logs'], 'readonly');
                const req = tx.objectStore('logs').index('personId').getAll(personId);
                return new Promise(resolve => req.onsuccess = () => resolve(req.result.sort((a,b) => b.createdAt - a.createdAt)));
            }
            async deleteLog(logId) {
                const tx = this.db.transaction(['logs'], 'readwrite');
                tx.objectStore('logs').delete(logId);
                return new Promise(resolve => tx.oncomplete = () => resolve());
            }
            async getFullBackup() {
                const persons = await this.getAllPersons();
                const tx = this.db.transaction(['logs'], 'readonly');
                const req = tx.objectStore('logs').getAll();
                return new Promise(resolve => req.onsuccess = () => resolve({ persons, logs: req.result }));
            }
        }

        class App {
            constructor() {
                this.db = new DBManager();
                this.currentPersonId = null;
                this.selectedFile = null;
                this.allPersonsCache = [];
                this.init();
                this.initEnhancedZoom();
            }

            async init() {
                await this.db.init();
                lucide.createIcons();
                await this.loadAllPersons();
            }

            generateId() { return Date.now().toString(36) + Math.random().toString(36).substr(2); }
            formatDate(ts) {
                const d = new Date(ts);
                return `${d.getFullYear()}/${d.getMonth()+1}/${d.getDate()} ${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}`;
            }

            async showList() {
                document.getElementById('detailPage').classList.remove('active');
                document.getElementById('listPage').classList.add('active');
                document.getElementById('backBtn').classList.add('hidden');
                document.getElementById('addPersonBtn').classList.remove('hidden');
                document.getElementById('headerTitle').textContent = '担当者一覧';
                this.currentPersonId = null;
                await this.loadAllPersons();
            }

            async showDetail(personId) {
                this.currentPersonId = personId;
                const person = await this.db.getPerson(personId);
                document.getElementById('listPage').classList.remove('active');
                document.getElementById('detailPage').classList.add('active');
                document.getElementById('backBtn').classList.remove('hidden');
                document.getElementById('addPersonBtn').classList.add('hidden');
                document.getElementById('headerTitle').textContent = '詳細';
                document.getElementById('detailName').textContent = person.name;
                document.getElementById('detailCompany').textContent = person.company || '（会社名なし）';
                document.getElementById('detailMemo').textContent = person.memo || 'メモなし';
                document.getElementById('logText').value = '';
                this.clearFileSelection();
                this.renderLogs();
            }

            openPersonModal(person = null) {
                const modal = document.getElementById('personModal');
                modal.style.display = 'flex';
                modal.classList.remove('hidden');
                if (person) {
                    document.getElementById('modalTitle').textContent = '担当者編集';
                    document.getElementById('personId').value = person.id;
                    document.getElementById('personName').value = person.name;
                    document.getElementById('personCompany').value = person.company || '';
                    document.getElementById('personMemo').value = person.memo || '';
                } else {
                    document.getElementById('modalTitle').textContent = '担当者追加';
                    document.getElementById('personId').value = '';
                    document.getElementById('personName').value = '';
                    document.getElementById('personCompany').value = '';
                    document.getElementById('personMemo').value = '';
                }
            }

            closeModal(id) {
                const el = document.getElementById(id);
                el.style.display = 'none';
                el.classList.add('hidden');
                if(id === 'zoomOverlay') this.resetZoom();
            }

            async loadAllPersons() {
                this.allPersonsCache = await this.db.getAllPersons();
                this.renderPersonList();
            }

            renderPersonList() {
                const listEl = document.getElementById('personList');
                const emptyMsg = document.getElementById('emptyListMessage');
                const query = document.getElementById('searchInput').value.toLowerCase().trim();
                listEl.innerHTML = '';
                const filtered = this.allPersonsCache.filter(p => (p.name+p.company).toLowerCase().includes(query));
                
                if (filtered.length === 0) {
                    emptyMsg.classList.remove('hidden');
                } else {
                    emptyMsg.classList.add('hidden');
                    filtered.forEach(p => {
                        const card = document.createElement('div');
                        card.className = 'bg-white p-5 rounded-xl shadow-sm border-2 border-stone-200 active:scale-[0.98] transition-all cursor-pointer flex items-center justify-between';
                        card.onclick = () => this.showDetail(p.id);
                        card.innerHTML = `
                            <div>
                                <div class="font-bold text-stone-900 text-xl">${p.name}</div>
                                <div class="text-base text-stone-600 font-bold">${p.company || '-'}</div>
                            </div>
                            <i data-lucide="chevron-right" class="text-stone-400 w-6 h-6"></i>
                        `;
                        listEl.appendChild(card);
                    });
                    lucide.createIcons();
                }
            }

            async savePerson() {
                const name = document.getElementById('personName').value.trim();
                if (!name) return UI.showAlert('名前を入力してください');
                const person = {
                    id: document.getElementById('personId').value || this.generateId(),
                    name: name,
                    company: document.getElementById('personCompany').value.trim(),
                    memo: document.getElementById('personMemo').value.trim()
                };
                await this.db.savePerson(person);
                this.closeModal('personModal');
                this.currentPersonId ? this.showDetail(this.currentPersonId) : this.loadAllPersons();
            }

            async editCurrentPerson() {
                this.openPersonModal(await this.db.getPerson(this.currentPersonId));
            }

            deleteCurrentPerson() {
                UI.showConfirm('この担当者を完全に削除しますか？', async () => {
                    await this.db.deletePerson(this.currentPersonId);
                    this.showList();
                });
            }

            async handleFileSelect(e) {
                const file = e.target.files[0];
                if (!file) return;
                const reader = new FileReader();
                reader.onload = (ev) => {
                    const img = new Image();
                    img.onload = () => {
                        const canvas = document.createElement('canvas');
                        let width = img.width, height = img.height;
                        const maxSize = 1280;
                        if (width > height) { if (width > maxSize) { height *= maxSize / width; width = maxSize; } }
                        else { if (height > maxSize) { width *= maxSize / height; height = maxSize; } }
                        canvas.width = width; canvas.height = height;
                        const ctx = canvas.getContext('2d');
                        ctx.drawImage(img, 0, 0, width, height);
                        this.selectedFile = { name: file.name, type: 'image/jpeg', dataUrl: canvas.toDataURL('image/jpeg', 0.8) };
                        document.getElementById('selectedFileName').textContent = `準備完了 (${Math.round(width)}x${Math.round(height)})`;
                    };
                    img.src = ev.target.result;
                };
                reader.readAsDataURL(file);
            }

            clearFileSelection() {
                this.selectedFile = null;
                document.getElementById('logFile').value = '';
                document.getElementById('selectedFileName').textContent = '';
            }

            async addLog() {
                const text = document.getElementById('logText').value.trim();
                if (!text && !this.selectedFile) return;
                await this.db.saveLog({
                    id: this.generateId(),
                    personId: this.currentPersonId,
                    text: text,
                    file: this.selectedFile
                });
                document.getElementById('logText').value = '';
                this.clearFileSelection();
                this.renderLogs();
            }

            async openEditLogModal(logId) {
                const log = await this.db.getLog(logId);
                if (!log) return;
                document.getElementById('editLogId').value = log.id;
                document.getElementById('editLogText').value = log.text || '';
                const modal = document.getElementById('editLogModal');
                modal.style.display = 'flex';
                modal.classList.remove('hidden');
                lucide.createIcons();
            }

            async saveEditedLog() {
                const id = document.getElementById('editLogId').value;
                const text = document.getElementById('editLogText').value.trim();
                const log = await this.db.getLog(id);
                if (log) {
                    log.text = text;
                    await this.db.saveLog(log);
                    this.closeModal('editLogModal');
                    this.renderLogs();
                }
            }

            async renderLogs() {
                const timelineEl = document.getElementById('timelineList');
                const logs = await this.db.getLogsByPersonId(this.currentPersonId);
                timelineEl.innerHTML = logs.length ? '' : '<p class="text-stone-500 text-base py-2 italic font-bold">記録なし</p>';
                logs.forEach(log => {
                    const item = document.createElement('div');
                    item.className = 'relative bg-white p-5 rounded-lg border-2 border-stone-100 shadow-sm';
                    item.innerHTML = `
                        <div class="absolute -left-[27px] mt-2 w-4 h-4 bg-stone-400 rounded-full border-4 border-stone-50"></div>
                        <div class="flex justify-between items-start mb-2">
                            <span class="text-sm font-bold text-stone-500">${this.formatDate(log.createdAt)}</span>
                            <div class="flex gap-2">
                                <button class="text-stone-400 hover:text-app-accent p-1" onclick="app.openEditLogModal('${log.id}')"><i data-lucide="edit-3" class="w-5 h-5"></i></button>
                                <button class="text-stone-400 hover:text-red-500 p-1" onclick="app.deleteLog('${log.id}')"><i data-lucide="trash" class="w-5 h-5"></i></button>
                            </div>
                        </div>
                        ${log.text ? `<p class="text-xl text-stone-900 font-bold whitespace-pre-wrap leading-relaxed">${log.text}</p>` : ''}
                        ${log.file ? `<img src="${log.file.dataUrl}" class="attachment-preview shadow-inner cursor-pointer" onclick="app.zoomImage('${log.file.dataUrl}')">` : ''}
                    `;
                    timelineEl.appendChild(item);
                });
                lucide.createIcons();
            }

            async deleteLog(id) {
                UI.showConfirm('この記録を削除しますか？', async () => {
                    await this.db.deleteLog(id);
                    this.renderLogs();
                });
            }

            // 強化版ズーム＆パン機能
            initEnhancedZoom() {
                const container = document.getElementById('zoomContainer');
                const img = document.getElementById('fullSizeImage');
                
                let state = {
                    scale: 1,
                    lastScale: 1,
                    posX: 0,
                    posY: 0,
                    lastPosX: 0,
                    lastPosY: 0,
                    startX: 0,
                    startY: 0,
                    startDist: 0,
                    isDragging: false
                };

                const updateTransform = () => {
                    img.style.transform = `translate(${state.posX}px, ${state.posY}px) scale(${state.scale})`;
                };

                container.addEventListener('touchstart', (e) => {
                    if (e.touches.length === 1) {
                        state.isDragging = true;
                        state.startX = e.touches[0].pageX - state.lastPosX;
                        state.startY = e.touches[0].pageY - state.lastPosY;
                    } else if (e.touches.length === 2) {
                        state.isDragging = false;
                        state.startDist = Math.hypot(
                            e.touches[0].pageX - e.touches[1].pageX,
                            e.touches[0].pageY - e.touches[1].pageY
                        );
                        state.lastScale = state.scale;
                    }
                }, { passive: false });

                container.addEventListener('touchmove', (e) => {
                    e.preventDefault(); // デフォルトのスクロール等を防止

                    if (state.isDragging && e.touches.length === 1) {
                        // パン（移動）
                        state.posX = e.touches[0].pageX - state.startX;
                        state.posY = e.touches[0].pageY - state.startY;
                        updateTransform();
                    } else if (e.touches.length === 2) {
                        // ピンチズーム
                        const dist = Math.hypot(
                            e.touches[0].pageX - e.touches[1].pageX,
                            e.touches[0].pageY - e.touches[1].pageY
                        );
                        state.scale = Math.min(Math.max(1, state.lastScale * (dist / state.startDist)), 8);
                        updateTransform();
                    }
                }, { passive: false });

                container.addEventListener('touchend', () => {
                    state.lastScale = state.scale;
                    state.lastPosX = state.posX;
                    state.lastPosY = state.posY;
                    state.isDragging = false;
                    
                    // 倍率がほぼ1ならリセット
                    if (state.scale <= 1.05) {
                        this.resetZoom();
                    }
                });

                this.resetZoom = () => {
                    state = {
                        scale: 1, lastScale: 1,
                        posX: 0, posY: 0,
                        lastPosX: 0, lastPosY: 0,
                        startX: 0, startY: 0,
                        startDist: 0, isDragging: false
                    };
                    updateTransform();
                };
            }

            zoomImage(url) {
                const overlay = document.getElementById('zoomOverlay');
                const img = document.getElementById('fullSizeImage');
                this.resetZoom();
                img.src = url;
                overlay.style.display = 'flex';
                overlay.classList.remove('hidden');
                lucide.createIcons();
            }

            async exportDataJSON() {
                const data = await this.db.getFullBackup();
                const blob = new Blob([JSON.stringify(data)], { type: 'application/json' });
                const url = URL.createObjectURL(blob);
                const a = document.createElement('a'); a.href = url; a.download = `deai-app-backup-${Date.now()}.json`; a.click();
            }

            async importDataJSON(e) {
                const file = e.target.files[0]; if (!file) return;
                const reader = new FileReader();
                reader.onload = async (ev) => {
                    try {
                        const { persons, logs } = JSON.parse(ev.target.result);
                        for (const p of persons) await this.db.savePerson(p);
                        for (const l of logs) await this.db.saveLog(l);
                        UI.showAlert('復元が完了しました'); this.loadAllPersons();
                    } catch (err) { UI.showAlert('ファイルが正しくありません'); }
                };
                reader.readAsText(file);
            }

            async exportLogsCSV() {
                const { persons, logs } = await this.db.getFullBackup();
                let csv = '\ufeff担当者,会社名,日時,やり取り内容\n';
                logs.forEach(l => {
                    const p = persons.find(person => person.id === l.personId) || { name: '削除済' };
                    const text = (l.text || '').replace(/"/g, '""');
                    csv += `"${p.name}","${p.company || ''}","${this.formatDate(l.createdAt)}","${text}"\n`;
                });
                const blob = new Blob([csv], { type: 'text/csv' });
                const url = URL.createObjectURL(blob);
                const a = document.createElement('a'); a.href = url; a.download = `やり取り記録_${new Date().toLocaleDateString()}.csv`; a.click();
            }
        }
        const app = new App();
    </script>
</body>
